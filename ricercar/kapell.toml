# kapell project file for "The Neighbour" (first kapell project and regression fixture)
[kapell]
kit = "0.1"

[piece]
name = "The Neighbour"
subtitle = "Ricercar a 4 on the Theme from Jurassic Park"
form = "double-fugue"          # a claim: the role-coverage check verifies it
key = "bes minor"
measure = "4/4"
voices = ["soprano", "alto", "tenor", "bass"]

[ranges]                       # MIDI note numbers
soprano = [60, 84]
alto = [53, 77]
tenor = [48, 72]
bass = [36, 62]

[paths]
score = "score/music-voices.ly"
sections = "score/sections"
piece_model = "design/final-lab/piece.py"
skeleton = "design/final-lab/SK_final.ly"
plan = "design/final-lab/plan.json"
materials = "design/final-lab/materials.ly"
blueprint = "design/BLUEPRINT.md"
performance = "performance"
scores_out = "score/out"

[quotas]
strong_suspensions = 20

[versions]
render = ["bach_organ", "beethoven_piano", "beethoven_quartet", "symphonic", "quintet"]

[themes]                       # label = materials variable (paths.materials), at reference pitch
S1 = "subjectOne"              # first label is the main subject
S2 = "subjectTwo"              # the second subject of the double fugue
CS1 = "csOne"
CS2 = "csTwo"

[checks]
resolution_beats = 4           # a chordal seventh must resolve within this many beats of leaving

# Featured roles: moments the analysis says a performance must bring out. piece.py has no
# feature flag, so they are declared here; roles.py also treats every piece-model
# subject/answer/cf role as featured. Every plan under performance/*/ needs a cue for each.
[[features]]
label = "arioso bass head imitation (S2 head c-a-f)"
voice = "bass"
at = "30:2"
until = "31:1"

[[features]]
label = "arioso tenor lament (d-flat c b-flat a a-flat g-flat)"
voice = "tenor"
at = "30:4.5"
until = "32:2"
